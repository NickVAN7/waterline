[project]
name = "waterline-cli"
version = "0.1.0"
description = "Waterline developer CLI (`waterline`, alias `wl`). Never deployed."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
waterline = "waterline_cli.main:app"
wl = "waterline_cli.main:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "PTH", "S", "TID", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The CLI's job is running fixed developer tools as subprocesses (never through a shell).
"src/waterline_cli/**" = ["S603", "S607"]
"tests/**" = ["S101"]
"tests/hooks/**" = ["S101", "S603", "S607"]
# Builds real git repositories to copy from.
"tests/test_review_copy.py" = ["S101", "S603", "S607"]

[tool.pyright]
# The Claude Code hooks (.claude/hooks/) are tested here too, under the same gates.
include = ["src", "tests", "../../.claude/hooks/guard_git.py", "../../.claude/hooks/protect_files.py"]
extraPaths = ["src", "../../.claude/hooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Claude Code hooks are stand-alone scripts; their tests import them from here.
pythonpath = ["../../.claude/hooks"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=waterline_cli",
    "--cov=guard_git",
    "--cov=protect_files",
    "--cov-report=term-missing:skip-covered",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Small and fully unit-testable: every branch, error paths included, must be exercised.
fail_under = 100
show_missing = true
