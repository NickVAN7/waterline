[project]
name = "waterline-backend"
version = "0.1.0"
description = "Waterline API and worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "faker>=40.39.0",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "polyfactory>=3.3.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# --- Lint & format ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PT", "RET", "PTH",
    "S", "ASYNC", "TID", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest tests are written
    "S105", "S106",  # fake credentials are test data
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Types -----------------------------------------------------------------------------------

[tool.pyright]
include = ["app", "migrations", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Tests & coverage (docs/testing-strategy.md) ---------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
]
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "concurrency(*tables): real commits on separate connections (the `concurrency` fixture); the named tables are truncated afterwards",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = false
# Imports needed only by the type checker never run, so they can never be covered.
exclude_also = ["if TYPE_CHECKING:"]

# --- Import rules (docs/build-plan.md, "Backend architecture" and "Feature map") -------------

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: routers -> services -> repositories -> models"
type = "layers"
layers = ["app.routers", "app.services", "app.repositories", "app.models"]
broken_contract_guidance = "Calls flow one way: routers -> services -> repositories -> models."

[[tool.importlinter.contracts]]
name = "Routers never touch repositories or models directly"
type = "forbidden"
source_modules = ["app.routers"]
forbidden_modules = ["app.repositories", "app.models"]
allow_indirect_imports = true
broken_contract_guidance = "Routers call one service method and return a response schema."

[[tool.importlinter.contracts]]
name = "Rules are pure: no database, no other layers"
type = "forbidden"
source_modules = ["app.rules"]
forbidden_modules = [
    "app.routers", "app.services", "app.repositories", "app.models", "app.jobs", "app.audit",
    "sqlalchemy", "psycopg", "procrastinate",
]
# Indirect imports count too: a rule must not reach the database through any module.
allow_indirect_imports = false
broken_contract_guidance = "rules/ holds pure logic; pass data in instead of querying for it."

[[tool.importlinter.contracts]]
name = "authz and audit sit below services"
type = "forbidden"
source_modules = ["app.authz", "app.audit"]
forbidden_modules = ["app.routers", "app.services"]
# Indirect too: e.g. authz -> jobs -> services would quietly put services beneath authz.
allow_indirect_imports = false
broken_contract_guidance = "Services call authorize() and log_change(), never the reverse."

[[tool.importlinter.contracts]]
name = "Only the worker imports job modules"
type = "forbidden"
source_modules = [
    "app.main", "app.routers", "app.services", "app.repositories", "app.models", "app.schemas",
    "app.core", "app.authz", "app.audit", "app.rules", "app.jobs.enqueue", "app.jobs.app",
]
forbidden_modules = ["app.jobs.tasks", "app.jobs.worker"]
# A new top-level app.* module (e.g. app/cli.py) is added to source_modules.
broken_contract_guidance = "Enqueue by task name through app.jobs.enqueue; only the worker imports jobs."

[[tool.importlinter.contracts]]
name = "Jobs never import routers"
type = "forbidden"
source_modules = ["app.jobs"]
forbidden_modules = ["app.routers"]
allow_indirect_imports = true
broken_contract_guidance = "Jobs reuse services, not HTTP endpoints."

# Service layer order (docs/build-plan.md, "Cross-area rules"), highest layer first. A service
# may import only services in lower layers, directly or through any other module; `|` siblings
# may not import each other. Every entry is optional "(module)", so each is enforced the moment
# its file exists. A new service module is added to its layer here.
[[tool.importlinter.contracts]]
name = "Service layers: services call lower layers only"
type = "layers"
containers = ["app.services"]
layers = [
    "(requirement) | (webhook)",
    "(sprint) | (testcase) | (test_run) | (github)",
    "(task)",
    "(project) | (phase) | (workstream) | (milestone)",
    "(auth) | (workspace) | (org)",
    "(user) | (numbering) | (approval) | (activity) | (comment) | (tag) | (link) | (search) | (health)",
]
broken_contract_guidance = "Call only services in lower layers; reach upward with a registered handler."
