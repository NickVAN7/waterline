# Local, fast checks on every commit (docs/testing-strategy.md, "Workflow and gates").
# Install once per clone: uv run pre-commit install
# The full gate is `uv run wl check`, which is also what CI runs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Secrets: gitleaks, pinned here for local runs and CI alike (pre-commit builds it, and
  # installs Go for that if needed). The staged changes on every commit; the whole git history
  # in `wl audit` (part of `wl check`), as the manual-stage `gitleaks-history` hook. A false
  # positive goes in .gitleaksignore (its fingerprint), with the owner's approval.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true

  # Ruff runs from each project's own environment, so hooks use the same pinned version and
  # configuration as `wl lint`.
  - repo: local
    hooks:
      - id: ruff-backend
        name: ruff (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-cli
        name: ruff (tools/cli)
        entry: uv run --directory tools/cli ruff check --fix .
        language: system
        files: ^tools/cli/.*\.py$
        pass_filenames: false
      - id: ruff-format-cli
        name: ruff format (tools/cli)
        entry: uv run --directory tools/cli ruff format .
        language: system
        files: ^tools/cli/.*\.py$
        pass_filenames: false

      # Frontend: Prettier and ESLint from the frontend's own node_modules (`npm ci` first).
      - id: prettier-frontend
        name: prettier (frontend)
        entry: npm --prefix frontend run --silent format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run --silent lint:fix
        language: system
        files: ^frontend/.*\.(ts|vue)$
        pass_filenames: false

      # Generated files are never hand-edited: each must match what its generator produces
      # from its source (`uv run wl gen-client` regenerates both).
      - id: openapi-fresh
        name: backend/openapi.json matches the API
        entry: uv run --directory backend python -m app.openapi_export --check
        language: system
        files: ^backend/(app/.*\.py|openapi\.json)$
        pass_filenames: false
      - id: client-fresh
        name: frontend/src/api/schema.d.ts matches backend/openapi.json
        entry: npm --prefix frontend run --silent check:client
        language: system
        files: ^(backend/openapi\.json|frontend/src/api/schema\.d\.ts)$
        pass_filenames: false
