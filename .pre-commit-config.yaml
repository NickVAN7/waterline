# Local, fast checks on every commit (docs/testing-strategy.md, "Workflow and gates").
# Install once per clone: uv run pre-commit install
# The full gate is `uv run wl check`, which is also what CI runs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Ruff runs from each project's own environment, so hooks use the same pinned version and
  # configuration as `wl lint`.
  - repo: local
    hooks:
      - id: ruff-backend
        name: ruff (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-cli
        name: ruff (tools/cli)
        entry: uv run --directory tools/cli ruff check --fix .
        language: system
        files: ^tools/cli/.*\.py$
        pass_filenames: false
      - id: ruff-format-cli
        name: ruff format (tools/cli)
        entry: uv run --directory tools/cli ruff format .
        language: system
        files: ^tools/cli/.*\.py$
        pass_filenames: false
